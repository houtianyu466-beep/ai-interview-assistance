server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: ai-interview-platform
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  # JWT 配置：secret 至少 32 个字符，生产环境务必通过环境变量覆盖

app:

  ai:
    # mock：本地模拟；openai：调用 OpenAI 兼容服务（DeepSeek 选这个）
    provider: ${APP_AI_PROVIDER:mock}
    base-url: ${APP_AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${DEEPSEEK_API_KEY}
    # 官方模型：deepseek-chat；如果用的是第三方代理，以其控制台模型名为准，不要带空格
    model: ${APP_AI_MODEL:deepseek-chat}
    temperature: 0.3
    timeout-seconds: 60
    fallback-enabled: true

  jwt:
    secret: ${APP_JWT_SECRET:ai-interview-platform-demo-secret-key-please-change-2026}
    expire-minutes: 240
    issuer: ai-interview-platform

  voice:
    provider: ${APP_ASR_PROVIDER:mock}
    # DeepSeek 不支持语音转写；接真实 ASR 时改这里
    base-url: ${APP_ASR_BASE_URL:}
    api-key: ${APP_ASR_API_KEY}
    model: ${APP_ASR_MODEL:whisper-1}
    language: zh
    timeout-seconds: 180
    max-size: 10485760
    # 流式转写：WS 长连接 + 客户端定长切片 + 服务端 VAD 断句 + 逐句转写
    stream:
      enabled: ${APP_ASR_STREAM_ENABLED:true}
      # 浏览器端降采样到 16kHz 单声道 16bit，必须与服务端一致
      sample-rate: 16000
      # 单帧时长：越小上行越及时，100ms 约 3.2KB/帧
      frame-ms: 100
      # VAD 静态能量阈值（归一化 RMS），安静环境可下调
      energy-threshold: 0.012
      # 自适应阈值系数：阈值 = max(静态阈值, 噪声底 × 系数)
      noise-factor: 3.0
      # 连续超过阈值多久才算「开始说话」，过滤咳嗽/点击
      min-speech-ms: 200
      # 说完后静音多久算一句结束——这是「说完到出字」的主要延迟
      end-silence-ms: 600
      # 单句最长时长，超时强制切段
      max-segment-ms: 15000
      # 切段时向前回补的音频，避免吞掉首字
      pre-roll-ms: 200
      # 转写线程数与排队上限
      worker-threads: 3
      queue-capacity: 4

  rag:
    enabled: true
    chunk-size: 600
    chunk-overlap: 80
    top-k: 5
    embedding:
      provider: ${APP_EMBEDDING_PROVIDER:none}
      # DeepSeek 不支持 embedding；要混合检索时换成支持 /embeddings 的服务
      base-url: ${APP_EMBEDDING_BASE_URL:}
      api-key: ${APP_EMBEDDING_API_KEY}
      model: ${APP_EMBEDDING_MODEL:text-embedding-3-small}
  # 面试教练 Agent
  agent:
    enabled: true
    max-steps: 4
  # 视频练习（WebRTC）
  video:
    ice-servers:
      - stun:stun.l.google.com:19302
  # 演示数据（首次启动自动灌入：admin/interviewer/candidate，密码 123456）
  demo-data:
    enabled: true

logging:
  level:
    root: INFO
    com.aiinterview: DEBUG
