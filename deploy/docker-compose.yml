# 生产部署编排：MySQL + Redis + 后端 + Nginx（静态前端）
#
# 使用前：
#   1) cp .env.example .env 并填写真实值
#   2) 在仓库根目录执行 cd web && npm ci && npm run build，产出 web/dist
#   3) 证书放到 deploy/certs/fullchain.pem、privkey.pem
#   4) docker compose up -d
#
# 说明：schema.sql 只在 MySQL 数据卷首次初始化时执行，重复启动不会重建表。

services:
  mysql:
    image: mysql:8.0
    container_name: ai-interview-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化建表；文件内有 DROP TABLE，切勿对已有库重复执行
      - ../src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ai-net]

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [ai-net]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai-interview-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER}
      APP_AI_BASE_URL: ${APP_AI_BASE_URL}
      APP_AI_MODEL: ${APP_AI_MODEL}
      APP_ASR_PROVIDER: ${APP_ASR_PROVIDER}
      APP_ASR_BASE_URL: ${APP_ASR_BASE_URL}
      APP_ASR_API_KEY: ${APP_ASR_API_KEY}
      APP_ASR_MODEL: ${APP_ASR_MODEL}
      APP_EMBEDDING_PROVIDER: ${APP_EMBEDDING_PROVIDER}
      APP_EMBEDDING_BASE_URL: ${APP_EMBEDDING_BASE_URL}
      APP_EMBEDDING_API_KEY: ${APP_EMBEDDING_API_KEY}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL}
      APP_TTS_PROVIDER: ${APP_TTS_PROVIDER}
      # demo-data 不是标准环境变量名，用 JSON 覆盖更可靠
      SPRING_APPLICATION_JSON: >-
        {"app":{"demo-data":{"enabled":${APP_DEMO_DATA_ENABLED:-false}}}}
      JAVA_OPTS: "-Xms512m -Xmx1024m -Duser.timezone=Asia/Shanghai"
    volumes:
      - app-data:/app/data
    networks: [ai-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-interview-nginx
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ai-interview.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../web/dist:/usr/share/nginx/html:ro
      - certbot-webroot:/var/www/certbot
    networks: [ai-net]

volumes:
  mysql-data:
  redis-data:
  app-data:
  certbot-webroot:

networks:
  ai-net:
    driver: bridge
