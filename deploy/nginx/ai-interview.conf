# AI 面试练习平台 · Nginx 反向代理
# 作用：托管前端静态文件、反代 /api 与 /ws、强制 HTTPS
# 证书路径与 deploy/.env 里的 APP_DOMAIN 保持一致

# WebSocket 升级所需的 Connection 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP：仅用于证书续期与跳转
server {
    listen 80;
    listen [::]:80;
    server_name interview.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name interview.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 简历 / 音频上传：与 spring.servlet.multipart 上限保持一致（12MB）
    client_max_body_size 12m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端 SPA
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 REST
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 语音转写、Agent 工具循环可能较慢，放宽读超时
        proxy_connect_timeout 10s;
        proxy_send_timeout   180s;
        proxy_read_timeout   180s;
    }

    # WebSocket：/ws/call（信令）、/ws/asr（流式转写）、/ws/interview（旧房间）
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：至少 1 小时，避免说话中途被网关断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 接口文档（不需要可整段删除）
    location = /swagger-ui.html {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    # 健康检查不对外开放
    location /actuator/ {
        return 404;
    }
}
